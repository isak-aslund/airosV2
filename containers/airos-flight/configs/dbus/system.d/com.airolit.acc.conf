<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow own="com.airolit.acc"/>
    <allow own="com.airolit.acc.settings"/>
    <allow own="com.airolit.fc"/>
    <allow own="com.airolit.camera"/>
    <allow send_destination="com.airolit.acc"/>
    <allow send_destination="com.airolit.acc.settings"/>
    <allow send_destination="com.airolit.fc"/>
    <allow send_destination="com.airolit.camera"/>
    <allow receive_sender="com.airolit.acc"/>
    <allow receive_sender="com.airolit.acc.settings"/>
    <allow receive_sender="com.airolit.fc"/>
    <allow receive_sender="com.airolit.camera"/>
  </policy>
</busconfig>
