# AirOS.conf
export FIRST_USER_NAME="${FIRST_USER_NAME:-cx10}"
export FIRST_USER_PASSWORD="${FIRST_USER_PASSWORD:-@airolit!!}"

# Default power mode for NVIDIA Jetson Orin NX
# 0 = MAXN (25W, 8 cores @ 2.0GHz, GPU @ 1.3GHz)
# 1 = 10W (4 cores @ 1.5GHz, GPU @ 0.6GHz)
# 2 = 15W (6 cores @ 1.5GHz, GPU @ 1.1GHz)
# 3 = 20W (6 cores @ 2.0GHz, GPU @ 1.3GHz) - Recommended for drones with Sightech software
export DEFAULT_POWER_MODE="${DEFAULT_POWER_MODE:-3}"

export IMX678_VENDOR="${IMX678_VENDOR:-econ}"  # Default: E-CON camera
export AR0234_USER="${AR0234_USER:-cx10}"  # Set to sightech for Sightech to own the camera
export ACC_VERSION="${ACC_VERSION:-v1.5.2}"
export NMEA_VERSION="${NMEA_VERSION:-v0.6.4}"
export MAVLINK_LOGGER_VERSION="${MAVLINK_LOGGER_VERSION:-master}"
export MAVLINK_ROUTER_VERSION="${MAVLINK_ROUTER_VERSION:-master}"
export MEDIAMTX_VERSION="${MEDIAMTX_VERSION:-v1.9.3}"
export SIGHTEC_VERSION="${SIGHTEC_VERSION:-85}"
